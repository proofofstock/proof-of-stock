name: CodeQL
# Static analysis of the JavaScript on GitHub's hosted runners. Public repository only (the private one is skipped by
# the `if`): the code is the same, and the private CI runs on our own runner, where a third-party analyser has no place.
# Findings land in the repository's code scanning tab, visible to its maintainers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 2'
permissions: read-all
jobs:
  analyze:
    if: github.repository == 'proofofstock/proof-of-stock'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
