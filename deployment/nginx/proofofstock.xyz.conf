server {
    listen 80;
    server_name proofofstock.xyz www.proofofstock.xyz stockofproof.xyz www.stockofproof.xyz tickerproof.xyz www.tickerproof.xyz;
    return 301 https://proofofstock.xyz$request_uri;
}
