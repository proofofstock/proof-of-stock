# deployment/nginx/proofofstock.xyz.conf — the public Stock Token Passport site at the root of proofofstock.xyz
# (apps/stocks-web.mjs on 127.0.0.1:3005). The app serves everything under /stocks; this host maps its own root onto that
# prefix, so https://proofofstock.xyz/ is the page and https://proofofstock.xyz/mcp the MCP server. The app builds every
# public link from STOCKS_PUBLIC_ORIGIN and STOCKS_PUBLIC_PATH, which match this mapping by default.
#
# proofofstock.xyz is the site's name since 10 Nov 2026 (the owner's choice). stockofproof.xyz, where it started, and
# tickerproof.xyz redirect every page to it, EXCEPT /mcp: an MCP client POSTs, and a redirected POST is not reliably
# followed, so /mcp is served on every name and agents configured with an older URL keep working.
#
# PUBLIC on purpose: no auth_basic. The site serves one page and read-only JSON; it has no accounts, cookies, wallet or
# write path.
#
# The client address: /etc/nginx/conf.d/cloudflare-realip.conf on the host already restores CF-Connecting-IP at http
# level for Cloudflare's ranges, so $remote_addr is the visitor; it is passed as X-Real-IP, which the app trusts only from
# the loopback (apps/stocks-web.mjs). X-Forwarded-For is cleared so nothing else claims to be the client.
#
# The firewall lets only Cloudflare reach 443, so the DNS records must stay proxied.
#
# Install (class D, on the owner's word), on the host as root:
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials <the ini the other certificates use> -d proofofstock.xyz -d www.proofofstock.xyz
#   (and the same for stockofproof.xyz and tickerproof.xyz, each with its www)
#   cp deployment/nginx/proofofstock.xyz.conf /etc/nginx/sites-available/proofofstock.xyz
#   ln -s /etc/nginx/sites-available/proofofstock.xyz /etc/nginx/sites-enabled/proofofstock.xyz
#   nginx -t && systemctl reload nginx

# The rate-limit key: an IPv4 address as is, an IPv6 address by its /56, as the app keys its own limit
# (apps/stocks-web.mjs clientKey). One IPv6 home or VPS usually holds a whole /56 or /64, so keying the /128 would hand
# one client billions of fresh quotas. $binary_remote_addr is 4 bytes for IPv4 and 16 for IPv6: the map keeps the first
# 7 bytes (56 bits) of a 16-byte one.
map $binary_remote_addr $stocks_client {
    "~^(?s)(?<stocks_v6_56>.{7}).{9}$" $stocks_v6_56;
    default $binary_remote_addr;
}
# ⚠ A zone's key cannot change on reload ("uses the ... key while previously it used ..."), and the failed reload leaves
#   the old config running. When the key changes, the zone gets a new name: 56 = keyed by $stocks_client (IPv6 /56).
limit_req_zone $stocks_client zone=stocks_req56:10m rate=10r/s;
limit_conn_zone $stocks_client zone=stocks_conn56:10m;

server {
    listen 443 ssl;
    server_name proofofstock.xyz;
    ssl_certificate /etc/letsencrypt/live/proofofstock.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proofofstock.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    # Cloudflare does not add HSTS (checked 11.11). No includeSubDomains or preload: those are hard to take back.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=stocks_req56 burst=40 nodelay;
    limit_conn stocks_conn56 20;

    # The public MCP server (apps/stocks-mcp-http.mjs): one JSON-RPC message per POST, at most 16 KB, read-only tools.
    # The only place on this host that takes a request body. GET and DELETE reach the app too, which answers them 405 as
    # the Streamable HTTP spec asks of a server with no event stream and no sessions: a 403 here made clients read it as
    # access denied.
    location = /mcp {
        limit_except GET POST OPTIONS DELETE { deny all; }
        # Above the app's 16 KB cap, so an oversized message gets the app's JSON-RPC 413 with CORS, not nginx's HTML.
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:3005/stocks/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
    }

    location ~ /\. { return 404; }

    # Everything else is the page, its two files and the read-only API: / here is /stocks/ in the app.
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3005/stocks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
    }
}

server {
    listen 443 ssl;
    server_name www.proofofstock.xyz;
    ssl_certificate /etc/letsencrypt/live/proofofstock.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proofofstock.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://proofofstock.xyz$request_uri;
}

